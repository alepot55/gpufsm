name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  cpu:
    name: lint + type + CPU tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (pure-Python, no CUDA)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Every tree, not just the package: scripts/ and experiments/ produce the
      # numbers the papers quote, and while they were outside this check they
      # accumulated 78 lint errors — including closures capturing a loop variable
      # and zip() calls that silently truncate on a length mismatch.
      - name: Ruff (lint + format check)
        run: |
          ruff check src tests scripts experiments paper/figures.py paper2/figures.py
          ruff format --check src tests scripts experiments paper/figures.py paper2/figures.py

      - name: Mypy
        run: mypy src/gpufsm

      - name: Pytest (CPU-only, GPU tests skipped)
        run: pytest -m "not gpu" -q

  cuda-syntax:
    name: CUDA sources compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The kernels are split one translation unit per family and compiled without
      # relocatable device code, so a __device__ helper called across a TU boundary
      # is a link error. No GPU is needed to catch that — only nvcc. This is the
      # cheapest guard that the split stays valid; a full build and the GPU tests
      # still need real hardware (see docs/REPRODUCIBILITY.md).
      - name: Install the CUDA toolkit (nvcc only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nvidia-cuda-toolkit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pybind11 headers
        run: pip install pybind11

      - name: Compile every translation unit
        run: |
          INC="$(python -c 'import pybind11; print(pybind11.get_include())')"
          PYINC="$(python -c 'import sysconfig; print(sysconfig.get_paths()["include"])')"
          for cu in src/gpufsm/backends/cuda/native/*.cu; do
            echo "== $cu"
            nvcc -std=c++17 -c "$cu" -o /dev/null \
              -I src/gpufsm/backends/cuda/native -I "$INC" -I "$PYINC" \
              --expt-relaxed-constexpr
          done
